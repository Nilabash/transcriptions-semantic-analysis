[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptions-analysis"
version = "0.1.0"
description = "Docker-first analytics for diarized transcription CSV quality over time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars[rtcompat]>=1.0.0,<2",
    "duckdb>=1.0.0,<2",
    "lingua-language-detector>=2.0,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ta-batch = "transcriptions_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
